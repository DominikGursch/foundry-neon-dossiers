name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: neon-dossiers-module
          path: |
            dist/*.zip
            dist/module.json
      - uses: actions/upload-artifact@v4
        with:
          name: neon-dossiers-browser-preview
          path: dist/preview
