name: Publish module release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("module.json", "utf8"));
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${manifest.version}` || pkg.version !== manifest.version) {
              throw new Error("Tag, package and manifest versions must match");
            }
            const root = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${manifest.version}`;
            if (manifest.manifest !== `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/module.json` ||
                manifest.download !== `${root}/neon-dossiers-${manifest.version}.zip`) {
              throw new Error("Release URLs must match this tag and repository");
            }
          '
      - run: npm test
      - run: npm run build
      - name: Publish tagged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/module.json "dist/neon-dossiers-${GITHUB_REF_NAME#v}.zip" \
            --verify-tag --title "Neon Dossiers $GITHUB_REF_NAME" --generate-notes
